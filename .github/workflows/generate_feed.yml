name: Generate Google Ads & ChatGPT Ads CSV Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "transform_cropink_feed.py"
      - "chatgpt_transform.py"
      - "transform_feed.py"
      - "street_shoes_extractor.py"
      - "top_revenue_feeds.py"
      - "tiktok_feed.py"
      - ".github/workflows/generate_feed.yml"

jobs:
  generate_csv:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Primary Transformation Script
        run: python transform_cropink_feed.py
        env:
          CROPINK_FEED_URL: "https://backend.ballzy.eu/et/amfeed/feed/download?id=102&file=cropink_et.xml"

      - name: Run ChatGPT Ads Transformation Script
        run: python chatgpt_transform.py
        env:
          CROPINK_FEED_URL: "https://backend.ballzy.eu/et/amfeed/feed/download?id=102&file=cropink_et.xml"

      - name: Run Street Shoes Product Extractor
        run: python street_shoes_extractor.py
        env:
          FEED_URL: "https://backend.ballzy.eu/et/amfeed/feed/download?id=102&file=cropink_et.xml"

      - name: Generate Top 50 Revenue Page Feeds
        run: python top_revenue_feeds.py
        env:
          GOOGLE_SHEET_ID: "1ZLASFV0JVAeIT4J3B4RNu-8NhDLFqd0Wsye2M_9eAR8"

      - name: Generate LV LT FI Catalogues
        run: python transform_feed.py

      - name: Generate TikTok Catalog Feed
        run: python tiktok_feed.py

      - name: Create .nojekyll
        run: touch .nojekyll

      - name: Verify OpenAI diagnostic feeds
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import csv
          import glob
          import os

          expected = [
              "item_id",
              "title",
              "description",
              "url",
              "image_url",
              "brand",
              "price",
              "availability",
              "seller_name",
              "target_countries",
              "is_eligible_search",
              "is_eligible_checkout",
              "is_ads_eligible",
          ]

          files = sorted(
              glob.glob("openai_diag_*.csv")
              + [
                  "chatgpt_ads_feed_lifestyle.csv",
                  "chatgpt_ads_feed_basketball.csv",
              ]
          )

          if not files:
              raise SystemExit("ERROR: No OpenAI feed files were generated.")

          for filename in files:
              with open(filename, "r", encoding="utf-8", newline="") as f:
                  reader = csv.DictReader(f)
                  if reader.fieldnames != expected:
                      raise SystemExit(
                          f"ERROR: {filename} header mismatch.\n"
                          f"Got: {reader.fieldnames}\nExpected: {expected}"
                      )
                  rows = list(reader)
                  if not rows:
                      raise SystemExit(f"ERROR: {filename} has zero products.")

                  for idx, row in enumerate(rows, start=2):
                      for col in expected:
                          if not str(row.get(col, "")).strip():
                              raise SystemExit(
                                  f"ERROR: {filename} row {idx}: {col} is empty"
                              )
                      if not row["url"].startswith("https://"):
                          raise SystemExit(f"ERROR: {filename} row {idx}: bad product URL")
                      if not row["image_url"].startswith("https://"):
                          raise SystemExit(f"ERROR: {filename} row {idx}: bad image URL")
                      if row["target_countries"] != "EE":
                          raise SystemExit(f"ERROR: {filename} row {idx}: target_countries != EE")
                      if row["is_eligible_search"] != "true":
                          raise SystemExit(f"ERROR: {filename} row {idx}: search flag != true")
                      if row["is_eligible_checkout"] != "false":
                          raise SystemExit(f"ERROR: {filename} row {idx}: checkout flag != false")
                      if row["is_ads_eligible"] != "true":
                          raise SystemExit(f"ERROR: {filename} row {idx}: ads flag != true")

              print(f"OK: {filename} ({len(rows):,} rows, {os.path.getsize(filename):,} bytes)")

          print("All OpenAI diagnostic feeds passed verification.")
          PY

      - name: Show Git status
        run: |
          git status --short
          git diff --stat || true

      - name: Commit and push generated files
        shell: bash
        run: |
          set -e
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated: Update product feeds"
          git push

      - name: Final status
        run: |
          git status --short
          echo ""
          echo "OpenAI diagnostic feeds:"
          ls -lah openai_diag_*.csv || true
          echo ""
          echo "Production ChatGPT Ads feeds:"
          ls -lah chatgpt_ads_feed_*.csv || true
