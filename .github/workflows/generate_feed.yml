name: Generate Google Ads & OpenAI Ads Feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "transform_cropink_feed.py"
      - "chatgpt_transform.py"
      - "transform_feed.py"
      - "street_shoes_extractor.py"
      - "top_revenue_feeds.py"
      - "tiktok_feed.py"
      - ".github/workflows/generate_feed.yml"

jobs:
  generate_csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Primary Google Ads Transformation
        run: python transform_cropink_feed.py
        env:
          CROPINK_FEED_URL: "https://backend.ballzy.eu/et/amfeed/feed/download?id=102&file=cropink_et.xml"

      - name: Run OpenAI Ads Transformation
        run: python chatgpt_transform.py
        env:
          CROPINK_FEED_URL: "https://backend.ballzy.eu/et/amfeed/feed/download?id=102&file=cropink_et.xml"

      - name: Run Street Shoes Product Extractor
        run: python street_shoes_extractor.py
        env:
          FEED_URL: "https://backend.ballzy.eu/et/amfeed/feed/download?id=102&file=cropink_et.xml"

      - name: Generate Top 50 Revenue Page Feeds
        run: python top_revenue_feeds.py
        env:
          GOOGLE_SHEET_ID: "1ZLASFV0JVAeIT4J3B4RNu-8NhDLFqd0Wsye2M_9eAR8"

      - name: Generate LV LT FI Catalogues
        run: python transform_feed.py

      - name: Generate TikTok Catalog Feed
        run: python tiktok_feed.py

      - name: Create .nojekyll
        run: touch .nojekyll

      - name: Verify OpenAI Ads feed files exist
        run: |
          set -e
          ls -lh openai_ads_native_lifestyle.csv
          ls -lh openai_ads_native_basketball.csv
          head -n 1 openai_ads_native_lifestyle.csv
          head -n 1 openai_ads_native_basketball.csv

      - name: Commit and push generated files
        shell: bash
        run: |
          set -e
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated: Update product feeds"
          git push

      - name: Final status
        run: |
          git status --short
          echo ""
          ls -lah openai_ads_native_*.csv || true
